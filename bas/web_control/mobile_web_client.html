<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#111318" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/pwa/icon-192.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/pwa/icon-192.svg" />
  <title>BAS台球系统</title>
  <link rel="stylesheet" href="/mobile_web_client.css" />
</head>
<body>
  <main class="app" id="app">
  <header class="system-bar">
    <span class="system-name">BAS台球系统</span>
    <div class="system-actions">
      <button class="install-button" id="installButton" type="button" hidden>安装应用</button>
      <span class="system-state" id="systemState" role="status" aria-live="polite">
        <span class="state-dot state-dot--offline" id="stateDot" aria-hidden="true"></span>
        <span id="stateText">未连接</span>
      </span>
    </div>
  </header>

    <section class="video-stage" id="videoStage" aria-label="实时台球画面">
      <img id="stream" src="/api/mjpeg" alt="实时台球画面，点击目标球可进行选择" draggable="false" />
      <div class="pocket-notice" id="pocketNotice" role="status" aria-live="assertive" aria-atomic="true" hidden>
        <span class="pocket-notice__title">进球！</span>
        <strong class="pocket-notice__message" id="pocketNoticeMessage"></strong>
      </div>
      <button class="fullscreen-button" id="fullscreenButton" type="button" aria-label="横屏全屏播放" title="横屏全屏播放">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" />
        </svg>
      </button>
    </section>

    <section class="mode-switch" aria-label="运行模式">
      <button class="mode-button is-active" id="eightBallMode" type="button" aria-pressed="true">
        <span class="mode-button__title">规则比赛</span>
        <span class="mode-button__hint">YOLO11m 四分类</span>
      </button>
      <button class="mode-button" id="pointsMode" type="button" aria-pressed="false">
        <span class="mode-button__title">编号球训练</span>
        <span class="mode-button__hint">YOLO11s 0–15</span>
      </button>
    </section>

    <div class="controls" id="ruleControls">
      <section class="control-group" aria-labelledby="coreControlLabel">
        <h2 class="control-label" id="coreControlLabel">核心控制</h2>
        <div class="control-row">
          <button class="control-button control-button--momentary" id="switchColorButton" type="button">切换花色</button>
          <button class="control-button" id="starFormulaButton" type="button" aria-pressed="false">颗星公式</button>
        </div>
      </section>

      <section class="control-group" aria-labelledby="currentRuleLabel">
        <h2 class="control-label" id="currentRuleLabel">当前规则</h2>
        <div class="control-row">
          <button class="control-button" id="ruleModeButton" type="button" aria-pressed="false">规则模式</button>
          <button class="control-button" id="hookModeButton" type="button" aria-pressed="false">勾球模式</button>
        </div>
      </section>

      <section class="control-group" aria-labelledby="nextShotLabel">
        <h2 class="control-label" id="nextShotLabel">下一杆</h2>
        <div class="control-row" id="nextShotChoices">
          <button class="control-button" id="nextHookButton" type="button" aria-pressed="false">下一杆勾球</button>
          <button class="control-button" id="nextBlackButton" type="button" aria-pressed="false">下一杆黑球</button>
        </div>
        <div class="shot-override" id="shotOverrideBanner" hidden>
          <span class="shot-override__status">
            <strong id="shotOverrideTitle">下一杆勾球</strong>
            <span class="shot-override__target" id="shotOverrideTarget" hidden>黑球</span>
          </span>
          <button class="shot-override__cancel" id="cancelShotOverrideButton" type="button">取消</button>
        </div>
      </section>

      <button class="replay-button" id="replayButton" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 7h8M7 10h10v8H7zM10 4h4" />
        </svg>
        <span>精彩瞬间录制</span>
      </button>
    </div>

    <section class="training-panel" id="trainingPanel" hidden aria-labelledby="trainingPanelTitle">
      <h2 class="training-panel__title" id="trainingPanelTitle">编号球训练</h2>
      <label class="training-field" for="trainingScenario">
        <span>训练项目</span>
        <select id="trainingScenario"></select>
      </label>
      <p class="training-description" id="trainingDescription">请选择训练项目</p>
      <div class="training-status" id="trainingStatus" role="status" aria-live="polite">等待摆球</div>
      <div class="training-progress-row">
        <progress id="trainingProgress" max="1" value="0"></progress>
        <span id="trainingProgressText">0/0</span>
      </div>
      <div class="control-row">
        <button class="control-button is-active" id="trainingStartButton" type="button">开始验证</button>
        <button class="control-button" id="trainingResetButton" type="button">重置本次</button>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/stream_coordinates.js" defer></script>
  <script src="/mobile_web_client.js" defer></script>
</body>
</html>
