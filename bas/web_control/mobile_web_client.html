<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#111318" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>PRECISION AI Web Client</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #111318;
      --surface-low: #1a1c20;
      --text: #e2e2e8;
      --ok: #5cde97;
      --danger: #ff6c7a;
      --phone-ratio: calc(19.5 / 9);
      --hud-blur: blur(14px);
      --app-vh: 1vh;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: radial-gradient(1300px 760px at 18% -16%, #22314d 0%, var(--bg) 44%);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior-y: contain;
      touch-action: pan-y;
    }

    .screen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: calc(var(--app-vh) * 100);
      display: grid;
      place-items: center;
      padding: 10px;
      z-index: 2;
    }

    .scroll-helper {
      height: 140px;
      width: 100%;
      pointer-events: none;
      opacity: 0;
    }

    .phone {
      width: min(100vw - 20px, calc((var(--app-vh) * 100 - 20px) * var(--phone-ratio)));
      height: min(calc(var(--app-vh) * 100 - 20px), calc((100vw - 20px) / var(--phone-ratio)));
      background: color-mix(in oklab, var(--surface-low) 94%, black);
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 16px 54px rgba(0, 72, 170, 0.18);
    }

    .main {
      position: absolute;
      inset: 0;
    }

    .video-stage {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      aspect-ratio: 16 / 9;
      width: auto;
      background: #050608;
      overflow: hidden;
    }

    #stream {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      cursor: crosshair;
      image-orientation: none;
      transform: none;
      filter: saturate(1.04) contrast(1.03);
      background: #000;
      user-select: none;
      -webkit-user-drag: none;
      touch-action: manipulation;
    }

    .top-hud {
      position: absolute;
      left: 12px;
      top: 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 12px;
      background: color-mix(in oklab, var(--surface-low) 70%, transparent);
      backdrop-filter: var(--hud-blur);
      font-family: "Space Grotesk", sans-serif;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
      z-index: 3;
      pointer-events: none;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--danger);
      box-shadow: 0 0 10px rgba(255, 108, 122, 0.8);
      transition: all 0.2s ease;
    }

    .dot.ok {
      background: var(--ok);
      box-shadow: 0 0 12px rgba(92, 222, 151, 0.85);
    }

    .bottom-hud {
      position: absolute;
      left: 12px;
      bottom: 12px;
      width: min(58%, 500px);
      padding: 10px 12px;
      border-radius: 12px;
      background: color-mix(in oklab, var(--surface-low) 70%, transparent);
      backdrop-filter: var(--hud-blur);
      font-size: 12px;
      line-height: 1.5;
      color: #d3d7e0;
      white-space: pre-wrap;
      z-index: 3;
      pointer-events: none;
      font-family: Inter, sans-serif;
    }

    .bottom-hud.hidden {
      display: none;
    }

    .quick-fs {
      position: absolute;
      right: 12px;
      top: 12px;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 12px;
      color: #dce7ff;
      background: color-mix(in oklab, #1d2738 84%, transparent);
      backdrop-filter: blur(8px);
      font-size: 20px;
      line-height: 1;
      z-index: 5;
      cursor: pointer;
    }

    .control-rail {
      position: absolute;
      right: 0;
      top: 0;
      height: 100%;
      width: max(72px, calc(100% - (100% * 16 / 9)));
      min-width: 72px;
      background: color-mix(in oklab, #111722 78%, black);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 4;
      padding-top: max(8px, env(safe-area-inset-top));
      padding-bottom: max(8px, env(safe-area-inset-bottom));
    }

    .rail-title {
      position: absolute;
      top: 14px;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-family: "Space Grotesk", sans-serif;
      font-size: 10px;
      letter-spacing: 0.14em;
      color: #9bb7ff;
      opacity: 0.92;
      text-transform: uppercase;
      user-select: none;
    }

    .ctrl-btn {
      width: 56px;
      border: 0;
      border-radius: 14px;
      padding: 9px 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      color: #cfd4df;
      background: #23262d;
      font-family: "Space Grotesk", sans-serif;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.14s ease, opacity 0.14s ease, background 0.16s ease;
    }

    .ctrl-btn:active {
      transform: scale(0.95);
    }

    .ctrl-btn:hover {
      opacity: 0.94;
      background: #2d323a;
    }

    .ctrl-btn.primary {
      color: #051f3d;
      background: linear-gradient(135deg, #adc6ff, #005bc1);
    }

    .ctrl-btn.active {
      outline: 1px solid rgba(173, 198, 255, 0.55);
      background: #2b3445;
      color: #dce7ff;
    }

    .icon {
      width: 24px;
      height: 24px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: color-mix(in oklab, black 22%, transparent);
      font-size: 13px;
      line-height: 1;
      font-weight: 800;
    }

    .ctrl-btn.primary .icon {
      background: color-mix(in oklab, white 18%, transparent);
    }

    @media (max-width: 860px) {
      .phone {
        width: 100vw;
        height: calc(100vw / var(--phone-ratio));
        border-radius: 0;
      }

      .control-rail {
        min-width: 68px;
      }

      .ctrl-btn {
        width: 50px;
      }

      .bottom-hud {
        width: 60%;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <div class="screen">
    <div class="phone">
      <div class="main">
        <div class="video-stage" id="videoStage">
          <img id="stream" src="/api/mjpeg" alt="实时台球画面" />
          <div class="top-hud">
            <span id="healthDot" class="dot"></span>
            <span>Precision AI Online</span>
          </div>
          <button id="btnQuickFullscreen" class="quick-fs" type="button" title="全屏">⛶</button>
          <div id="status" class="bottom-hud">初始化中...</div>
        </div>

        <aside class="control-rail">
          <div class="rail-title">TACTICIAN</div>
          <button id="btnCompute" class="ctrl-btn primary" type="button">
            <span class="icon">●</span>
            <span>Compute</span>
          </button>
          <button id="btnDetect" class="ctrl-btn" type="button">
            <span class="icon">◎</span>
            <span>Detect</span>
          </button>
          <button id="btnReload" class="ctrl-btn" type="button">
            <span class="icon">↻</span>
            <span>Reconnect</span>
          </button>
          <button id="btnToggleLog" class="ctrl-btn active" type="button">
            <span class="icon">☰</span>
            <span id="logLabel">Log On</span>
          </button>
          <button id="btnFullscreen" class="ctrl-btn" type="button">
            <span class="icon">⛶</span>
            <span id="fsLabel">Fullscreen</span>
          </button>
        </aside>
      </div>
    </div>
  </div>
  <div class="scroll-helper" aria-hidden="true"></div>

  <script>
    const streamEl = document.getElementById('stream');
    const statusEl = document.getElementById('status');
    const healthDot = document.getElementById('healthDot');
    const btnCompute = document.getElementById('btnCompute');
    const btnDetect = document.getElementById('btnDetect');
    const btnReload = document.getElementById('btnReload');
    const btnToggleLog = document.getElementById('btnToggleLog');
    const btnFullscreen = document.getElementById('btnFullscreen');
    const btnQuickFullscreen = document.getElementById('btnQuickFullscreen');
    const logLabel = document.getElementById('logLabel');
    const fsLabel = document.getElementById('fsLabel');

    let lastState = null;
    let logVisible = true;
    let lastTapTs = 0;

    function setViewportVh() {
      const h = window.innerHeight || document.documentElement.clientHeight || 0;
      document.documentElement.style.setProperty('--app-vh', `${h * 0.01}px`);
    }

    function nudgeAddressBarCollapse() {
      setTimeout(() => window.scrollTo(0, 1), 40);
      setTimeout(() => window.scrollTo(0, 1), 260);
    }

    async function postJson(url, payload = {}) {
      const r = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      return r.json();
    }

    function setLogVisible(show) {
      logVisible = !!show;
      statusEl.classList.toggle('hidden', !logVisible);
      btnToggleLog.classList.toggle('active', logVisible);
      logLabel.textContent = logVisible ? 'Log On' : 'Log Off';
    }

    function syncFullscreenButton() {
      const isFs = !!document.fullscreenElement;
      btnFullscreen.classList.toggle('active', isFs);
      fsLabel.textContent = isFs ? 'Exit Full' : 'Fullscreen';
      btnQuickFullscreen.textContent = isFs ? '⤢' : '⛶';
      btnQuickFullscreen.title = isFs ? 'Exit fullscreen' : 'Fullscreen';
    }

    async function toggleFullscreen() {
      try {
        if (!document.fullscreenElement) {
          if (document.documentElement.requestFullscreen) {
            await document.documentElement.requestFullscreen();
          }
        } else if (document.exitFullscreen) {
          await document.exitFullscreen();
        }
      } catch (e) {
        renderStatus(lastState, `Fullscreen failed: ${e}`);
      } finally {
        syncFullscreenButton();
      }
    }

    function renderStatus(state, msg = '') {
      if (!state) {
        statusEl.textContent = msg || 'Connecting...';
        return;
      }
      const routeScore = Number((state.route && state.route.score) ?? 0);
      const routePocket = (state.route && (state.route.pocket_id ?? state.route.pocket_index)) ?? '-';
      const routeKind = (state.route && state.route.shot_type) || state.route_type || '-';
      const route = state.route
        ? `Route: pocket=${routePocket} score=${routeScore.toFixed(3)} type=${routeKind}`
        : 'Route: -';

      statusEl.textContent = [
        msg || 'Running',
        `Mode: ${(state.shot_mode && (state.shot_mode.name || state.shot_mode.code)) || '-'}`,
        `Frame: ${state.frame_idx}`,
        `Size: ${state.frame_size.w} x ${state.frame_size.h}`,
        `Tracks: ${Array.isArray(state.tracks) ? state.tracks.length : 0}`,
        `Selected: ${state.selected_track_id ?? '-'}`,
        route,
      ].join('\n');
    }

    async function fetchState() {
      try {
        const r = await fetch('/api/state', { cache: 'no-store' });
        const data = await r.json();
        lastState = data;
        healthDot.classList.add('ok');
        renderStatus(data);
      } catch (e) {
        healthDot.classList.remove('ok');
        renderStatus(lastState, `Connection failed: ${e}`);
      }
    }

    streamEl.addEventListener('click', async (ev) => {
      if (!lastState || !lastState.frame_size || !lastState.frame_size.w || !lastState.frame_size.h) {
        renderStatus(lastState, 'No frame available for selection');
        return;
      }
      const rect = streamEl.getBoundingClientRect();
      const sx = (ev.clientX - rect.left) / rect.width;
      const sy = (ev.clientY - rect.top) / rect.height;
      const x = Math.max(0, Math.round(sx * lastState.frame_size.w));
      const y = Math.max(0, Math.round(sy * lastState.frame_size.h));
      try {
        const data = await postJson('/api/select', { x, y });
        lastState = data.state || lastState;
        renderStatus(lastState, data.ok ? '已发送选点' : '选点失败');
      } catch (e) {
        renderStatus(lastState, `Select failed: ${e}`);
      }
    });

    streamEl.addEventListener('touchend', (ev) => {
      const now = Date.now();
      if (now - lastTapTs < 280) {
        ev.preventDefault();
        toggleFullscreen();
      }
      lastTapTs = now;
    }, { passive: false });

    btnCompute.addEventListener('click', async () => {
      try {
        const data = await postJson('/api/compute', {});
        lastState = data.state || lastState;
        renderStatus(lastState, data.ok ? '计算完成' : '计算失败');
      } catch (e) {
        renderStatus(lastState, `Compute failed: ${e}`);
      }
    });

    btnDetect.addEventListener('click', async () => {
      try {
        const data = await postJson('/api/detect', {});
        lastState = data.state || lastState;
        renderStatus(lastState, data.ok ? '检测完成' : '检测失败');
      } catch (e) {
        renderStatus(lastState, `Detect failed: ${e}`);
      }
    });

    btnReload.addEventListener('click', () => {
      streamEl.src = `/api/mjpeg?t=${Date.now()}`;
      nudgeAddressBarCollapse();
    });

    btnToggleLog.addEventListener('click', () => {
      setLogVisible(!logVisible);
    });

    btnFullscreen.addEventListener('click', toggleFullscreen);
    btnQuickFullscreen.addEventListener('click', toggleFullscreen);

    document.addEventListener('fullscreenchange', syncFullscreenButton);
    window.addEventListener('resize', () => {
      setViewportVh();
      nudgeAddressBarCollapse();
    });
    window.addEventListener('orientationchange', () => {
      setViewportVh();
      nudgeAddressBarCollapse();
    });

    setViewportVh();
    setLogVisible(true);
    syncFullscreenButton();
    nudgeAddressBarCollapse();
    setInterval(fetchState, 900);
    fetchState();
  </script>
</body>
</html>
