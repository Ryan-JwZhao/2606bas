# BAS 局域网 HTTPS 反向代理配置
#
# 启动方式：
#   nginx.exe -p C:/path/to/2606BAS/deploy/nginx -c nginx.conf
#
# BAS 本身继续监听 127.0.0.1:17070/0.0.0.0:17070，Nginx 只负责 IPv4 HTTPS。

worker_processes 1;

pid logs/nginx.pid;
error_log logs/error.log warn;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;

    access_log logs/access.log;
    sendfile off;
    keepalive_timeout 65;
    server_tokens off;

    proxy_temp_path temp/proxy_temp;

    upstream bas_web_control {
        server 127.0.0.1:17070;
        keepalive 16;
    }

    server {
        # 优先使用明确的 IPv4 地址，避免无意中暴露到其它网卡。
        listen 172.16.10.166:443 ssl;
        server_name 172.16.10.166;

        ssl_certificate certs/bas-lan.crt;
        ssl_certificate_key certs/bas-lan.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:bas_tls:10m;
        ssl_session_timeout 10m;

        # 实时视频流必须关闭代理缓冲，并允许长连接。
        location = /mjpeg {
            proxy_pass http://bas_web_control/mjpeg;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            add_header Cache-Control "no-store" always;
        }

        location = /api/mjpeg {
            proxy_pass http://bas_web_control/api/mjpeg;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            add_header Cache-Control "no-store" always;
        }

        # 单帧画面不应被浏览器或代理缓存，否则手机可能看到旧画面。
        location = /frame.jpg {
            proxy_pass http://bas_web_control/frame.jpg;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        location = /api/frame.jpg {
            proxy_pass http://bas_web_control/api/frame.jpg;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        # 页面、PWA manifest、Service Worker、API 以及其它兼容接口统一转发。
        location / {
            proxy_pass http://bas_web_control;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_redirect off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }

    # 如需启用 IPv6，可在确认 Windows 防火墙和证书 SAN 已配置后，
    # 将下面这一行加入上面的 server 块：
    # listen [fc00::10:872e:e311:780f:f456]:443 ssl;
}
