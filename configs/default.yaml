camera:
  backend: auto  # auto | nori | opencv | video | synthetic
  camera_id: overhead_main
  device_index: 0
  width: 1920
  height: 1080
  fps: 30
  video_path:
  nori_sdk_root: C:/CodeProject/2604BilliardsAssistanceSystem/example/Nori_Xvision_Development_Kit_Ver10.00.06_Windows
  nori_device_id: 0
  exposure_auto: false
  exposure_level: -5
  distortion_correction_enabled: true
  distortion_correction_file: C:/CodeProject/2604BilliardsAssistanceSystem/calib/intrinsics_opencv.yaml

detector:
  backend: disabled  # disabled | debug_color | ultralytics
  model_path: C:/CodeProject/2604BilliardsAssistanceSystem/example/parameters/0323_225p_yolo11m_best.pt
  class_file_path: C:/CodeProject/2604BilliardsAssistanceSystem/example/parameters/seg.txt
  class_names: [cue, solid, stripe, black, cue_stick]
  conf: 0.35
  iou: 0.45
  device: "0"
  tile_size: 1280
  tile_overlap: 0.25
  max_det_per_tile: 200
  batch_size: 4
  detect_interval_frames: 1
  detect_fps_limit_hz: 6.0

tracker:
  high_conf: 0.45
  low_conf: 0.12
  max_lost_frames: 12
  vote_window: 20
  match_distance_px: 90.0
  match_iou: 0.15
  velocity_smoothing: 0.35

calibration:
  # You can point these to the existing 2604 calibration files.
  camera_file: C:/CodeProject/2604BilliardsAssistanceSystem/calib/calibration_opencv.yaml
  projection_file: C:/CodeProject/2604BilliardsAssistanceSystem/presets/projection_calibration.json
  table_width_mm: 2540.0
  table_height_mm: 1270.0
  ball_diameter_mm: 57.15

geometry:
  outline_path: C:/CodeProject/data/0618_DrawLine/outline.json
  inline_path: C:/CodeProject/data/0618_DrawLine/inline.json
  pocket_path: C:/CodeProject/data/0618_DrawLine/pocket.json

state:
  still_speed_px_s: 25.0
  moving_speed_px_s: 65.0
  stable_frames: 12
  armed_frames: 4
  settle_frames: 18
  anomaly_frames: 8

planner:
  enabled: true
  shot_mode: rule
  max_cut_angle_deg: 80.0
  top_k: 5
  cue_path_margin_mm: 3.0
  object_path_margin_mm: 3.0
  collision_padding_mm: 2.0
  free_max_collisions: 2

learning:
  ranker_enabled: true
  ranker_model_path:
  score_blend: 0.65
  collect_enabled: false
  samples_directory: rl/data/samples
  min_candidates: 1

projection:
  enabled: true
  projector_width: 1280
  projector_height: 800
  screen_index: 1
  fullscreen: true

replay:
  enabled: true
  directory: replays
  write_video: false
  write_debug_frames: false

logging:
  directory: logs
  level: INFO
